name: Publication signée SoundLive NDI
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: soundlive-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[publish] '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les sources
        run: |
          python3 -m py_compile ecran.py tableau.py commun.py publier-version.py
          bash -n installer-ubuntu.sh
          python3 tests/test-multi-output-media.py
          python3 -c 'from pathlib import Path; s=Path("tableau.html").read_text(); Path("/tmp/soundlive-tableau.js").write_text(s.split("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/soundlive-tableau.js
      - name: Construire et signer
        env:
          PUBLICATION_KEY: ${{ secrets.SOUNDLIVE_PUBLICATION_KEY }}
          PUBLICATION_PASSPHRASE: ${{ secrets.SOUNDLIVE_PUBLICATION_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp "$RUNNER_TEMP/soundlive-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          if [[ -z "$PUBLICATION_KEY" ]]; then
            echo "::error::Secret Actions SOUNDLIVE_PUBLICATION_KEY absent ou inaccessible."
            exit 1
          fi
          printf '%s\n' "$PUBLICATION_KEY" > "$key"
          askpass=$(mktemp "$RUNNER_TEMP/soundlive-askpass.XXXXXX")
          trap 'rm -f "$key" "$askpass"' EXIT
          printf '%s\n' '#!/bin/sh' 'printf "%s\\n" "$PUBLICATION_PASSPHRASE"' > "$askpass"
          chmod 700 "$askpass"
          export SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          if ! actual=$(ssh-keygen -y -f "$key" </dev/null | awk '{print $1, $2}'); then
            echo "::error::Impossible de déverrouiller la clé. Vérifie SOUNDLIVE_PUBLICATION_PASSPHRASE."
            exit 1
          fi
          expected=$(awk '{print $1, $2}' publication.pub)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::La clé privée ne correspond pas à publication.pub."
            exit 1
          fi
          python3 publier-version.py --cle "$key" --sortie "$RUNNER_TEMP/dist" --compatibilite
      - name: Publier les archives signées
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'from pathlib import Path; from versions_regie import software_version; print(software_version(Path("tableau.py").read_bytes(), "tableau.py"))')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            if gh release view "$tag" --json isDraft,isPrerelease,assets --jq '(.isDraft == false and .isPrerelease == false) and ([.assets[] | select(.state == "uploaded" and .size > 0) | .name] | contains(["SoundLive-NDI.zip","SoundLive-NDI.zip.sig","SoundLive-Ecrans.zip","SoundLive-Ecrans.zip.sig"]))' | grep -qx true; then
              echo "::notice::Version $tag déjà publiée avec ses quatre fichiers. Aucune modification."
              exit 0
            fi
            echo "::error::Release $tag existante mais incomplète. Vérification manuelle nécessaire."
            exit 1
          fi
          gh release create "$tag" "$RUNNER_TEMP/dist/"*.zip "$RUNNER_TEMP/dist/"*.sig --target "$GITHUB_SHA" --title "SoundLive-NDI $version" --generate-notes
