name: Test lecteurs Ethernet sans Wi-Fi
on:
  push:
    branches: [main]
    paths:
      - 'preparer-lecteur-linux.sh'
      - 'preparer-lecteur-windows.ps1'
      - 'soundlive-ndi-network-static.sh'
      - 'soundlive-ndi-network-windows.ps1'
      - 'installation-lecteur-linux.sh'
      - 'installer-client.sh'
      - 'installer-bureau-distant-linux.sh'
      - 'installer-ubuntu.sh'
      - 'installer-pi.sh'
      - 'installer-client-windows.py'
      - 'configurer-session-lecteur-linux.sh'
      - 'configurer-session-lecteur-windows.ps1'
      - 'versions_regie.py'
      - 'certificats_acme.py'
      - 'acme_powerdns.py'
      - 'gestion_acme_powerdns.py'
      - 'acces_regie.py'
      - 'regie-windows.py'
      - 'deploiement_lecteur.py'
      - 'page_ssh.py'
      - 'addsshkey.html'
      - 'tableau.py'
      - 'diagnostic.py'
      - 'commun.py'
      - 'tableau.html'
      - 'tests/**'
      - '.github/workflows/test-network-readers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-no-wifi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Installer la dépendance de validation des certificats ACME
        shell: bash
        run: python3 -m pip install cryptography
      - name: Test Linux sans Wi-Fi et syntaxe Bash
        shell: bash
        run: bash tests/test-network-no-wifi.sh
      - name: Test génération commandes du tableau
        shell: bash
        run: node tests/test-pairing.js
      - name: Test VNC/RDP Ubuntu et syntaxe installateur
        shell: bash
        run: |
          bash -n installer-bureau-distant-linux.sh
          python3 tests/test-vnc-routing.py
          python3 tests/test-desktop-services.py
          bash tests/test-vnc-install.sh
          bash tests/test-session-lecteur.sh
          python3 tests/test-autologin-gdm.py
          python3 tests/test-deploiement.py
          python3 tests/test-sudo-ssh.py
          python3 tests/test-certificats-acme.py
          python3 tests/test-powerdns-acme.py
          python3 tests/test-identify-popup.py
          python3 tests/test-desktop-remmina.py
  windows-no-wifi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Installer la dépendance ACME sous Windows
        shell: powershell
        run: python -m pip install cryptography
      - name: Test PowerShell Windows sans Wi-Fi et analyse AST
        shell: powershell
        run: .\\tests\\test-network-no-wifi.ps1
      - name: Vérifier autologin et veille Windows (sans modification)
        shell: powershell
        run: .\\tests\\test-session-lecteur-windows.ps1
      - name: Vérifier les commandes Windows de préparation et déploiement SSH
        shell: powershell
        run: .\\tests\\test-page-ssh-windows.ps1
      - name: Vérifier la protection DPAPI de la clé API PowerDNS
        shell: powershell
        run: python tests/test-powerdns-dpapi.py
