<!doctype html>

     Société SoundLive -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__ · SoundLive-NDI</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #fff5f7;
      background: #100e12;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 85% 0%, #421925, transparent 55%),
                  radial-gradient(ellipse at 10% 100%, #1c1524, transparent 65%);
    }
    main {
      width: min(100%, 450px);
      padding: clamp(24px, 6vw, 40px);
      border: 1px solid #4d3544;
      border-radius: 22px;
      background: #1b171e;
      box-shadow: 0 24px 72px #09060bb8;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; }
    .mark { width: 10px; height: 24px; border-radius: 3px; background: #ee4560; }
    h1 { margin: 24px 0 8px; font-size: clamp(2rem, 8vw, 2.8rem); letter-spacing: -.045em; line-height: 1; }
    p { margin: 0; color: #d5c6d2; line-height: 1.5; }
    form { display: grid; gap: 16px; margin-top: 24px; }
    [hidden] { display: none; }
    label { display: grid; gap: 7px; color: #f0dfe9; font-size: .92rem; }
    input, button { font: inherit; min-height: 46px; border-radius: 9px; }
    input { width: 100%; padding: 11px 13px; border: 1px solid #675061; background: #120e14; color: #fff5f7; }
    button { margin-top: 3px; padding: 11px; border: 1px solid #cf2547; background: #cf2547; color: #fff; font-weight: 700; cursor: pointer; }
    button:hover { background: #b82040; }
    input:focus-visible, button:focus-visible { outline: 2px solid #ff9db0; outline-offset: 3px; }
    .feedback { margin-top: 16px; padding: 11px 13px; border: 1px solid #614555; border-radius: 8px; background: #2a202a; }
    .error { color: #ffb7c4; background: #371e2b; }
    footer { margin-top: 24px; padding-top: 15px; border-top: 1px solid #493440; color: #c1afbe; font-size: .85rem; }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <div class="brand"><span class="mark" aria-hidden="true"></span>SoundLive-NDI</div>
    <h1 id="title">__TITLE__</h1>
    <p>__DESCRIPTION__</p>
    <p class="feedback" role="status" __NOTICE_HIDDEN__>__NOTICE__</p>
    <p class="feedback error" role="alert" __ERROR_HIDDEN__>__ERROR__</p>
    <form method="post" action="/connexion" __FORM_HIDDEN__>
      <label>Identifiant
        <input name="identifiant" autocomplete="username" maxlength="32" required>
      </label>
      <label>Mot de passe
        <input name="mot_de_passe" type="password" autocomplete="current-password" maxlength="256" required>
      </label>
      <button type="submit">Se connecter</button>
    </form>
    <footer>Régie distante · v__VERSION__ · © 2026 Société SoundLive</footer>
  </main>
</body>
</html>
